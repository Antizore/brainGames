<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app-container">
    <div id="view-menu" class="view active">
        <header>
            <h1>Brain Games</h1>
            <p>Choose game</p>
        </header>
        <div class="game-grid">
            <button class="game-btn" data-game="math-addition">
                <span class="icon">➕</span> Math
            </button>
            <button class="game-btn disabled" data-game="memory">
                <span class="icon">🧠</span> Memory (coming soon)
            </button>
        </div>
    </div>

    <div id="view-game" class="view">
        <header class="game-header">
            <button class="back-btn" id="btn-back">🔙 Wróć</button>
            <h2 id="game-title">Game Title</h2>
            <div class="score-display">Points: <span id="score">0</span></div>
        </header>
        <div id="game-content"></div>
    </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
